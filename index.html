  .sub { color:var(--dim); font-size:12px; margin-bottom:16px; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card h2 { font-size:13px; margin:0 0 10px; color:var(--dim); font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; }
  th,td { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line);
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  th.num { text-align:right; }
  #board col.c-rank { width:76px; }
  #board col.c-score { width:72px; }
  #board col.c-delta { width:62px; }
  #board col.c-time { width:104px; }
  .up { color:var(--up); } .down { color:var(--down); } .warn { color:var(--warn); }
  .tag { font-size:11px; padding:1px 6px; border-radius:999px; border:1px solid var(--line); }
  #chart { width:100%; height:380px; display:block; }
  .legend { display:flex; flex-wrap:wrap; gap:12px; margin-top:8px; font-size:12px; }
  .legend i { display:inline-block; width:10px; height:3px; margin-right:5px;
              vertical-align:middle; border-radius:2px; }
  .winbtn { background:transparent; color:var(--dim); border:1px solid var(--line);
            border-radius:6px; padding:2px 8px; font-size:11px; cursor:pointer; margin-left:4px; }
  .winbtn.active { color:var(--fg); border-color:#3b4252; background:#1f232b; }
  .ev { font-size:12px; padding:4px 0; border-bottom:1px dashed var(--line); }
  .move { font-size:10px; margin-left:4px; font-variant-numeric:tabular-nums; }
  .muted { color:var(--dim); }
  .status { display:inline-flex; align-items:center; gap:6px; margin-left:12px;
            padding:2px 10px; border:1px solid var(--line); border-radius:999px; font-size:12px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--up); }
  .dot.stale { background:var(--warn); }
  tbody tr:nth-child(even) { background:rgba(255,255,255,0.015); }
  tbody tr.r1 td:first-child { color:#e3b341; font-weight:700; }
  tbody tr.r2 td:first-child { color:#c9d1d9; font-weight:700; }
  tbody tr.r3 td:first-child { color:#a371f7; font-weight:700; }

</div>

<script src="data.js"></script>
<script>
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c=='"') q=true;
    else if(c==','){ row.push(cur); cur=''; }
    else if(c=='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(c!='\r') cur+=c;
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.length>1);
}

async function loadCSV(name){
  // When opened via file:// the fetch below is blocked; data.js (optional)
  // injects window.MON_DATA = { "monitor_log.csv": "...", ... } instead.
  if (window.MON_DATA && window.MON_DATA[name]) return parseCSV(window.MON_DATA[name]);
  const r = await fetch(name + '?t=' + Date.now());
  if(!r.ok) throw new Error(name + ' ' + r.status);
  return parseCSV(await r.text());
}

async function reloadDataBundle(){
  // The initial <script src="data.js"> is cached by the browser. Re-fetch it
  // explicitly on every refresh, otherwise window.MON_DATA never changes and
  // the visible tbest values stay frozen at the first page load.
  try {
    const r = await fetch('data.js?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) return false;
    let text = (await r.text()).trim();
    const prefix = 'window.MON_DATA=';
    if(text.startsWith(prefix)){
      text = text.slice(prefix.length).trim();
      if(text.endsWith(';')) text = text.slice(0, -1);
      window.MON_DATA = JSON.parse(text);
      return true;
    }
  } catch(err) {
    // file:// or a temporary CDN failure: keep the last complete bundle.
  }
  return false;
}

function fmtTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleString('zh-CN',{hour12:false, month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function fmtRankMove(oldRank, newRank, showFlat=true){
  const a = Number(oldRank), b = Number(newRank);
  if(!Number.isFinite(a) || !Number.isFinite(b)) return '';
  if(a === b) return showFlat ? '<span class="move muted">持平</span>' : '';
  if(b < a) return `<span class="move up">↑${a-b}</span>`;
  return `<span class="move down">↓${b-a}</span>`;
}

function parseRankMove(text){
  const s = String(text || '');
  if(s.includes('↑')) return '<span class="move up">'+s.match(/↑\d+/)?.[0]+'</span>';
  if(s.includes('↓')) return '<span class="move down">'+s.match(/↓\d+/)?.[0]+'</span>';
  if(s.includes('持平')) return '<span class="move muted">持平</span>';
  return '';
}

async function refresh(){
  await reloadDataBundle();
  let log, evt;
  try { log = await loadCSV('monitor_log.csv'); }
  catch(e){ document.querySelector('#board tbody').innerHTML =
      '<tr><td colspan="5" class="muted">找不到 monitor_log.csv —— 请先运行 monitor_tbest.py，并用 http 服务打开本页</td></tr>'; return; }
  try { evt = await loadCSV('monitor_events.csv'); } catch(e){ evt=[]; }

  const head = log[0], rows = log.slice(1);
  const idx = n => head.indexOf(n);
  const oT=idx('ts_bj'),oR=idx('rank'),oN=idx('team'),oU=idx('user_id'),
        oS=idx('submission_id'),oSc=idx('score'),oC=idx('create_time'),
        oCC=idx('case_count'),oPC=idx('public_count'),oHC=idx('hidden_count');

  // group by poll timestamp
  const polls = new Map();
  for(const r of rows){
    if(!polls.has(r[oT])) polls.set(r[oT],[]);
    polls.get(r[oT]).push(r);
  }
  const times = [...polls.keys()].sort();
  const last = times[times.length-1];
  const prev = times[times.length-2];
  const cur = polls.get(last)||[], old = prev?polls.get(prev)||[]:[];
  const countOf = r => [
    oCC >= 0 ? parseInt(r[oCC],10) : 20,
    oPC >= 0 ? parseInt(r[oPC],10) : 15,
    oHC >= 0 ? parseInt(r[oHC],10) : 5
  ];
  const counts = cur.length ? countOf(cur[0]) : [20,15,5];
  const [caseCount, publicCount, hiddenCount] = counts;
  window.__caseCounts = {caseCount, publicCount, hiddenCount};
  const oldCounts = old.length ? countOf(old[0]) : counts;
  const sameTestSet = oldCounts[0] === caseCount &&
                      oldCounts[1] === publicCount &&
                      oldCounts[2] === hiddenCount;
  const oldMap = new Map((sameTestSet ? old : []).map(r=>[r[oU], r]));
  const pubHead = document.getElementById('publicHead');
  if(pubHead) pubHead.textContent = publicCount > 0 ? `③ 公开 case 的全局 tbest（${publicCount} 例，µs）` : '③ 公开 case 的全局 tbest';
  const scope = document.getElementById('hiddenScope');
  if(scope){
    scope.textContent = `当前共 ${caseCount} 个测试点：公开 ${publicCount} 个、隐藏 ${hiddenCount} 个。`
      + '隐藏点只能给隐藏层整体 tbest 趋势，无法从总分唯一反解逐点 tbest。';
  }

  // our own hidden-average ratio, solved from case_count*score - public_sum
  (function(){
    const OUR = '6a9fde1cc76b321ca6f7988c';
    const me = cur.find(r => r[oU] === OUR);
    if(!me) return;
    const sc = parseFloat(me[oSc]);
    const ps = parseFloat(me[8] || '0');
    if(!(ps > 0) || !(hiddenCount > 0)) return;
    const hiddenAvg = (caseCount * sc - ps) / hiddenCount;
    if(hiddenAvg > 0.1 && hiddenAvg < 99){
      const q = Math.pow(1.5, 100 / hiddenAvg - 1);
      window.__hiddenQ = q;
      renderHiddenTable(q, '由本队总分反解', window.__tbIdx || 1,
                        '', NaN, NaN, caseCount, publicCount, hiddenCount);
    }
  })();

  // header status: data age
  (function(){
    const txt = document.getElementById('statusText');
    const dot = document.querySelector('#status .dot');
    if(!txt || !last) return;
    const d = new Date(String(last).replace(' ','T'));
    const age = Math.max(0, Math.round((Date.now() - d.getTime())/1000));
    txt.textContent = `数据 ${last.slice(11)} · 延迟 ${age}s · ${times.length} 轮`;
    if(dot) dot.className = 'dot' + (age > 180 ? ' stale' : '');
  })();

  cur.sort((a,b)=> (+a[oR]) - (+b[oR]));
  const tb = document.querySelector('#board tbody');
  tb.innerHTML = cur.map(r=>{
    const o = oldMap.get(r[oU]);
    const d = o ? (+r[oSc] - +o[oSc]) : 0;
    const cls = d>1e-9?'up':(d<-1e-9?'down':'muted');
    const dtxt = o && Math.abs(d)>1e-9 ? (d>0?'+':'')+d.toFixed(2) : '';
    const rk = +r[oR];
    return `<tr class="${rk<=3?'r'+rk:''}"><td class="num">#${r[oR]}${fmtRankMove(o && o[oR], r[oR], false)}</td><td>${r[oN]||r[oU]}</td>
      <td class="num">${(+r[oSc]).toFixed(2)}</td>
      <td class="num ${cls}">${dtxt}</td>
      <td class="muted">${fmtTime(r[oC])}</td></tr>`;
  }).join('');

  renderTbestPanel(times, polls);

  chartData = { times, polls, f: { oN, oSc }, last };
  renderChartFromState();
  refreshTbest(times, polls);
  refreshTbEvents(times, polls);
}

async function refreshTbDay(){
  const box = document.getElementById('tbday');
  if(!box) return;
  let rows;
  try { rows = await loadCSV('tbest_changes.csv'); }
  catch(e){ box.innerHTML = '<div class="muted">暂无变更记录</div>'; return; }
  if(!rows || rows.length < 2){ box.innerHTML = '<div class="muted">今日暂无 tbest 变更</div>'; return; }
  const head = rows[0], body = rows.slice(1);
  const iT=head.indexOf('ts_bj'), iN=head.indexOf('case_index'),
        iV=head.indexOf('tbest_us'), iP=head.indexOf('prev_us'), iD=head.indexOf('delta_us');

  const rowsHtml = body.slice(-40).reverse().map(r=>{
    const d = parseFloat(r[iD]);
    const cls = d<0?'up':(d>0?'down':'muted');
    const tb = parseFloat(r[iV]);
    return `<tr><td class="muted">${r[iT].slice(5)}</td><td>case#${r[iN]}</td>
      <td class="num">${parseFloat(r[iP]).toFixed(2)} → <b>${tb.toFixed(2)}</b>
        <span class="${cls}">${d>0?'+':''}${d.toFixed(2)}</span></td>
      </tr>`;
  }).join('');

  box.innerHTML = `<table style="table-layout:fixed">
    <colgroup><col style="width:24%"><col style="width:18%"><col></colgroup>
    <thead><tr><th>时间</th><th>case</th><th class="num">全局 tbest (µs)</th></tr></thead>
    <tbody>${rowsHtml}</tbody></table>
    <div class="muted" style="font-size:11px;margin-top:6px">
      共 ${body.length} 条变更　·　tbest 为平台实测值（10 s 采样，精确）。
      公开 case 的本队用时请直接看榜单。</div>`;
}

// ---- chart time window ------------------------------------------------
let chartWindowMin = 30;
let chartData = null;

function renderChartFromState(){
  if(!chartData) return;
  const { times, polls, f, last } = chartData;
  let ts = times;
  if(chartWindowMin > 0 && times.length > 2){
    const end = new Date(String(times[times.length-1]).replace(' ','T')).getTime();
    const cutoff = end - chartWindowMin * 60000;
    ts = times.filter(t => {
      const m = new Date(String(t).replace(' ','T')).getTime();
      return m >= cutoff;
    });
    if(ts.length < 2) ts = times.slice(-2);
  }
  drawChart(ts, polls, f, ts[ts.length-1]);
}

document.querySelectorAll('.winbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.winbtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    chartWindowMin = parseInt(btn.dataset.min, 10);
    renderChartFromState();
  });
});

// ---- reverse estimate: our time = tbest * our t/tbest ----------------
function bindCalc(){
  const tb = document.getElementById('tbIn');
  const rt = document.getElementById('rIn');
  const out = document.getElementById('tOut');
  const hint = document.getElementById('tHint');
  if(!tb || !rt) return;
  const upd = () => {
    const T = parseFloat(tb.value), q = parseFloat(rt.value);
    if(!(T > 0) || !(q > 0)){ out.textContent = '—'; hint.textContent = ''; return; }
    const t = T * q;
    const s = 100 / (1 + Math.log(q) / Math.log(1.5));
    out.textContent = t.toFixed(2) + ' µs';
    hint.textContent = `（该 case 得分 ≈ ${s.toFixed(1)} / 100）`;
  };
  tb.addEventListener('input', upd);
  rt.addEventListener('input', upd);
  const sel = document.getElementById('caseSel');
  if(sel) sel.addEventListener('change', ()=>{ tb.value = sel.value; upd(); });
  upd();
}
bindCalc();

// ---- current hidden cases: aggregate trend only ----
function renderHiddenTable(qOurs, source, tbScale, confidence, ciLow, ciHigh,
                           caseCount=20, publicCount=15, hiddenCount=5){
  const q = qOurs || 2.30;
  const f = (tbScale && tbScale > 0) ? tbScale : 1.0;
  const conf = confidence === 'high' ? '较高'
    : confidence === 'medium' ? '中等'
    : confidence === 'low' ? '较低' : '待定';
  const lastR = Number(window.__lastEventR);
  const lastMove = Number.isFinite(lastR) && lastR > 0
    ? `<span class="${lastR < 1 ? 'up' : (lastR > 1 ? 'down' : 'muted')}">${lastR.toFixed(4)}×</span>`
    : '<span class="muted">尚未观测</span>';
  const ci = Number.isFinite(+ciLow) && Number.isFinite(+ciHigh)
    ? ` · 累计 95% CI ${(+ciLow).toFixed(3)}–${(+ciHigh).toFixed(3)}`
    : '';
  const tb = document.querySelector('#hiddenTb tbody');
  if(!tb) return;
  const rows = [];
  for(let i=0;i<hiddenCount;i++){
    const caseNo = publicCount + i + 1;
    rows.push(`<tr><td>case#${caseNo}</td>
      <td class="num">隐藏层 ×${f.toFixed(4)}</td>
      <td class="num">${lastMove}</td>
      <td class="muted" style="font-size:11px">${conf} · 5 点聚合</td></tr>`);
  }
  tb.innerHTML = rows.join('');
  const note = document.getElementById('hiddenQ');
  if(note){
    note.textContent = `本队隐藏平均 ratio = ${q.toFixed(3)}×` + (source ? `（${source}）` : '')
      + `　·　共 ${caseCount} 点：公开 ${publicCount}、隐藏 ${hiddenCount}`
      + `　·　隐藏层累计 tbest 指数 ×${f.toFixed(4)}`
      + ci
      + `　·　指数/r <1 表示隐藏 tbest 变快，>1 表示变慢`;
  }
}
renderHiddenTable(2.30, '', 1, '', NaN, NaN, 20, 15, 5);

async function renderTbestPanel(times, polls){
  const box = document.getElementById('events');
  try {
    let rows;
    try { rows = await loadCSV('tbest_log.csv'); }
    catch(e){ box.innerHTML = '<div class="muted">data.js 里没有 tbest_log.csv（等待下一轮推送）</div>'; return; }
    if(!rows || rows.length < 2){ box.innerHTML = '<div class="muted">等待首个采样…</div>'; return; }

    const head = rows[0];
    const body = rows.slice(1).filter(r => r.length >= 4);
    const iT=head.indexOf('ts_bj'), iN=head.indexOf('case_index'),
          iV=head.indexOf('tbest_us'), iC=head.indexOf('case_id');
    if(iT<0||iN<0||iV<0){ box.innerHTML = '<div class="muted">tbest_log 表头异常</div>'; return; }

    // rows are appended in time order: take the last timestamp block, and the one before it
    const lastTs = body[body.length-1][iT];
    const cur = body.filter(r => r[iT] === lastTs);
    const prevTs = body.filter(r => r[iT] !== lastTs).slice(-1)[0];
    const prev = prevTs ? body.filter(r => r[iT] === prevTs[iT]) : [];
    const prevMap = {};
    prev.forEach(r => { prevMap[r[iN]] = parseFloat(r[iV]); });

    const html = cur
      .sort((a,b)=> parseFloat(a[iN]) - parseFloat(b[iN]))
      .map(r=>{
        const ci = r[iN], v = parseFloat(r[iV]);
        const p = prevMap[ci];
        const d = (p!=null && Math.abs(v-p)>1e-9) ? v-p : 0;
        const cls = d<0 ? 'up' : (d>0 ? 'down' : 'muted');
        const dtxt = d ? `${d>0?'+':''}${d.toFixed(2)}` : '—';
        const cid = iC >= 0 ? String(r[iC] || '').slice(-6) : '';
        return `<tr><td>case#${ci}</td><td class="muted">…${cid}</td><td class="num">${v.toFixed(2)}</td>
                <td class="num ${cls}">${dtxt}</td></tr>`;
      }).join('');

    box.innerHTML = `<table style="table-layout:fixed">
      <colgroup><col style="width:24%"><col style="width:26%"><col style="width:28%"><col style="width:22%"></colgroup>
      <thead><tr><th>测试点</th><th>case_id</th><th class="num">tbest (µs)</th><th class="num">较上次</th></tr></thead>
      <tbody>${html}</tbody></table>
      <div class="muted" style="font-size:11px;margin-top:6px">
      数据时间 ${lastTs.slice(11)}　·　绿=变快，红=变慢</div>`;

    // feed the reverse-estimate dropdown: case -> tbest
    const sel = document.getElementById('caseSel');
    if(sel){
      const opts = cur.slice().sort((a,b)=> parseFloat(a[iN]) - parseFloat(b[iN]))
        .map(r=>`<option value="${parseFloat(r[iV])}">case#${r[iN]} → ${parseFloat(r[iV]).toFixed(2)} µs</option>`);
      sel.innerHTML = opts.join('');
      sel.dispatchEvent(new Event('change'));
    }
  } catch(err) {
    box.innerHTML = '<div class="muted">渲染失败：' + (err && err.message ? err.message : err) + '</div>';
  }
}

async function refreshTbEvents(times, polls){
  const box = document.getElementById('tbevents');
  let rows;
  try { rows = await loadCSV('infer_report.csv'); }
  catch(e){
    box.innerHTML = '<div class="muted">尚无隐藏 tbest 刷新记录</div>';
    return;
  }
  if(!rows || rows.length < 2){
    box.innerHTML = `<div class="muted">尚未观察到 case#16–20 的全局 tbest 刷新事件。
      系统持续用“未换 submission 的隐藏分数阶跃”做交叉验证。</div>`;
    return;
  }
  const head = rows[0], body = rows.slice(1);
  const ix = n => head.indexOf(n);
  const iT=ix('ts_bj'), iR=ix('implied_r'), iCum=ix('cumulative_index'),
        iDir=ix('direction'), iConf=ix('confidence'), iTeams=ix('teams_used'),
        iSubs=ix('teams_submitted'), iRole=ix('top_role'),
        iTop=ix('top_team'), iTopRank=ix('top_rank'), iTopBefore=ix('top_rank_before'),
        iSubmitNames=ix('submitted_teams'), iAffected=ix('affected_top'),
        iLo=ix('ci_low'), iHi=ix('ci_high');
  const prettyTeams = s => String(s || '').split(';').filter(Boolean).map(x=>{
    const m = x.match(/^(#\d+)\s+(.*?)（([^）]*)）$/);
    return m ? `${m[1]} <b>${m[2]}</b>${parseRankMove(m[3])}` : x;
  }).join('　·　');
  const out = body.slice(-30).reverse().map(r=>{
    const rr = parseFloat(r[iR]);
    const cum = parseFloat(r[iCum]);
    const slowed = String(r[iDir] || '').startsWith('slower');
    const dirCls = slowed ? 'down' : (rr < 1 ? 'up' : 'muted');
    const dirText = slowed ? '变慢 / 疑似违规清理' : '变快';
    const conf = r[iConf] === 'high' ? '较高'
      : r[iConf] === 'medium' ? '中等'
      : r[iConf] === 'low' ? '较低' : '待定';
    const role = r[iRole] === 'submitted' ? '本秒提交队伍' : '未识别新提交；首个受影响样本';
    const topMove = fmtRankMove(r[iTopBefore], r[iTopRank]);
    const top = r[iTop]
      ? `#${r[iTopRank]} <b>${r[iTop]}</b>${topMove}`
      : '未识别';
    const submitted = prettyTeams(r[iSubmitNames]) || '无';
    const affected = prettyTeams(r[iAffected]) || '—';
    const ci = r[iLo] && r[iHi]
      ? ` · 本次 95% CI ${(+r[iLo]).toFixed(3)}–${(+r[iHi]).toFixed(3)}`
      : '';
    return `<div class="ev">
      <div><span class="tag ${dirCls}">case#16–20</span>
        <b>${r[iT].slice(11)}</b>　全局 tbest ${dirText}
        <span class="${dirCls}">r=${rr.toFixed(4)}×</span>
        <span class="muted">· 累计 ×${cum.toFixed(4)}${ci}</span></div>
      <div style="margin-top:3px">${role}：${top}
        <span class="muted">· 置信度 ${conf} · 样本 ${r[iTeams]}</span></div>
      <div class="muted" style="margin-top:2px">本轮新提交（${r[iSubs]||0}）：${submitted}</div>
      <div class="muted" style="margin-top:2px">受影响样本前三：${affected}</div>
    </div>`;
  });
  box.innerHTML = `<div class="muted" style="font-size:11px;margin-bottom:6px">
      共 ${body.length} 次已确认刷新 · 排名箭头相对上一轮采样；↑ 表示名次上升</div>`
    + out.join('');
}

async function refreshTbest(times, polls){
  const box = document.getElementById('tbest');
  const counts = window.__caseCounts || {caseCount:20, publicCount:15, hiddenCount:5};
  const {caseCount, publicCount, hiddenCount} = counts;
  let rows;
  try { rows = await loadCSV('infer_report.csv'); }
  catch(e){ rows = null; }
  const lastTs = times && times.length ? times[times.length-1] : '';
  const nTeams = polls && lastTs ? (polls.get(lastTs)||[]).length : 0;
  const status = `<div class="muted" style="font-size:12px;margin-bottom:8px">
     监控中：已采样 <b>${times?times.length:0}</b> 轮 · <b>${nTeams}</b> 支队伍 ·
     共 <b>${caseCount}</b> 个测试点（公开 ${publicCount} / 隐藏 ${hiddenCount}）·
     最近采样 ${lastTs?lastTs.slice(11):'—'}（每 10 秒采样一轮）</div>`;
  if(!rows || rows.length < 2){
    window.__tbIdx = 1;
    window.__lastEventR = NaN;
    // fallback: derive the hidden-layer level directly from score arithmetic
    // case_count*score = sum(all case scores); public case scores are known.
    let proxy = '';
    const cur = (polls && lastTs) ? (polls.get(lastTs) || []) : [];
    const vals = [];
    for (const r of cur) {
      const sc = parseFloat(r[5]), ps = parseFloat(r[8]);
      if (!isFinite(sc) || !isFinite(ps) || ps <= 0 || hiddenCount <= 0) continue;
      const hiddenAvg = (caseCount * sc - ps) / hiddenCount;
      if (hiddenAvg > 0.1 && hiddenAvg < 99) {
        vals.push({ s: hiddenAvg, r: Math.pow(1.5, 100 / hiddenAvg - 1) });
      }
    }
    if (vals.length >= 3) {
      vals.sort((a,b)=>a.s-b.s);
      const m = vals[Math.floor(vals.length/2)];
      proxy = `<div style="font-size:26px;margin:8px 0 4px">
          隐藏 ${hiddenCount} 例平均得分 <b>${m.s.toFixed(1)}</b> <span class="muted" style="font-size:13px">/ 100</span>
        </div>
        <div style="font-size:15px;margin-bottom:6px">
          对应平均 t/tbest ≈ <b>${m.r.toFixed(2)}×</b>
          <span class="muted" style="font-size:12px">（样本 ${vals.length} 队，取中位数）</span>
        </div>`;
    }
    box.innerHTML = status + proxy +
      `<div style="font-size:14px;margin:8px 0 4px">case#${publicCount+1}–${publicCount+hiddenCount}：尚未发生可确认的隐藏 tbest 刷新事件</div>
       <div class="muted" style="font-size:12px">
       判定条件：先扣除公开 ${publicCount} 例得分，再要求多个“未换 submission_id”的隐藏分数同向阶跃。<br>
       页面只预测最后 ${hiddenCount} 个隐藏 case；公开 case 单独刷新不会被算成隐藏刷新。</div>`;
    return;
  }
  const head = rows[0], body = rows.slice(1);
  const idx = n => head.indexOf(n);
  const last = body[body.length-1];
  const iPoll=idx('poll'),
        iTeams=(idx('teams_used')>=0?idx('teams_used'):idx('teams_moved')),
        iMed=idx('median_delta'),
        iR=idx('implied_r'), iCum=idx('cumulative_index'),
        iLo=idx('ci_low'), iHi=idx('ci_high'),
        iCumLo=idx('cumulative_ci_low'), iCumHi=idx('cumulative_ci_high'),
        iAgree=idx('r2'), iConf=idx('confidence'),
        iMajUp=idx('majority_up'), iMajFrac=idx('majority_fraction'),
        iTopRole=idx('top_role'), iTopTeam=idx('top_team'),
        iTopRank=idx('top_rank'), iTopBefore=idx('top_rank_before'),
        iTopDelta=idx('top_rank_delta'), iSubmitted=idx('submitted_teams'),
        iAffected=idx('affected_top');
  const cum = +last[iCum], r = +last[iR];
  window.__lastEventR = r;
  const iDir = idx('direction');
  const slowed = iDir >= 0 && String(last[iDir]).indexOf('slower') === 0;
  const confidence = iConf >= 0 ? last[iConf] : '';
  const confidenceCn = confidence === 'high' ? '较高'
    : confidence === 'medium' ? '中等'
    : confidence === 'low' ? '较低' : '待定';
  const agree = iAgree >= 0 && last[iAgree] !== ''
    ? `同向一致率 ${(100 * (+last[iAgree])).toFixed(1)}%`
    : '';
  const majority = iMajUp >= 0
    ? `${last[iMajUp] === 'yes' ? '上涨' : '下降'}`
      + (iMajFrac >= 0 && last[iMajFrac] !== ''
        ? ` ${(100 * (+last[iMajFrac])).toFixed(1)}%`
        : '')
    : '';
  const topRole = iTopRole >= 0 ? String(last[iTopRole] || '') : '';
  const topRank = iTopRank >= 0 && last[iTopRank] !== '' ? `#${last[iTopRank]}` : '';
  const topMove = iTopDelta >= 0
    ? fmtRankMove(iTopBefore >= 0 ? last[iTopBefore] : NaN, last[iTopRank])
    : '';
  const topTeam = iTopTeam >= 0 && last[iTopTeam]
    ? `${topRank} <b>${last[iTopTeam]}</b>${topMove}`
    : '未识别到具体触发队伍';
  const submitterLine = topRole === 'submitted'
    ? `本秒新提交队伍：${topTeam}`
    : `本秒未识别到新提交；首个受影响样本：${topTeam}`;
  const submittedList = iSubmitted >= 0 && last[iSubmitted]
    ? String(last[iSubmitted]).split(';').slice(0,5)
        .map(s=>{
          const m = s.match(/^(#\d+)\s+(.*?)（([^）]*)）$/);
          return m ? `${m[1]} <b>${m[2]}</b>${parseRankMove(m[3])}` : s;
        }).join('　·　')
    : '无';
  const affectedList = iAffected >= 0 && last[iAffected]
    ? String(last[iAffected]).split(';').slice(0,3)
        .map(s=>{
          const m = s.match(/^(#\d+)\s+(.*?)（([^）]*)）$/);
          return m ? `${m[1]} <b>${m[2]}</b>${parseRankMove(m[3])}` : s;
        }).join('　·　')
    : '—';
  window.__tbIdx = cum;
  renderHiddenTable(
    window.__hiddenQ, '由本队总分反解', cum, confidence,
    iCumLo >= 0 ? last[iCumLo] : NaN,
    iCumHi >= 0 ? last[iCumHi] : NaN,
    caseCount, publicCount, hiddenCount
  );
  const dir = slowed ? '变慢（可能是违规代码被清理，tbest 退回较大值）'
                     : (cum < 1 ? '变快（tbest 变小）' : '不变');
  box.innerHTML = status +
    `<div style="font-size:26px;margin:6px 0 8px">
       隐藏层累计 tbest 指数 <b>${cum.toFixed(3)}×</b>
       <span class="muted" style="font-size:12px">（基准=本次监控起点）</span></div>
     <div style="font-size:15px;margin-bottom:6px">
       累计 95% CI：${iCumLo >= 0 && last[iCumLo] ? `${(+last[iCumLo]).toFixed(3)}–${(+last[iCumHi]).toFixed(3)}` : '—'}
       <span class="muted">　·　置信度：<b>${confidenceCn}</b></span></div>
     <div class="muted" style="font-size:12px">
       最近事件：${last[idx('ts_bj')] ? last[idx('ts_bj')].slice(11) : 'poll '+last[iPoll]}，
       ${last[iTeams]} 个未换 submission 的样本，
       隐藏分数和变化中位 ${(+last[iMed]).toFixed(2)}，本次倍率 r=${r.toFixed(4)}
       ${iLo>=0 && last[iLo] ? `（95% CI ${(+last[iLo]).toFixed(3)}–${(+last[iHi]).toFixed(3)}）` : ''}
       ${agree ? '，' + agree : ''}
       ${majority ? `，多数队伍分数${majority}` : ''}<br>
       <span style="color:var(--fg)">${submitterLine}</span><br>
       本轮新提交：${submittedList}<br>
       受影响样本前三：${affectedList}<br>
       解读：相对监控起点，隐藏层 tbest ${dir}，累计约 <b>${cum.toFixed(3)}×</b>
     </div>
     <div class="muted" style="font-size:11px;margin-top:6px">
       已从总分中精确扣除公开 ${publicCount} 例得分。隐藏 ${hiddenCount} 例的逐点 tbest 和时间仍不可见，
       故隐藏表只能给隐藏层整体倍率；r&lt;1 是变快，r&gt;1 是变慢/清退。
     </div>`;
}

function drawChart(times, polls, f, last){
  const svg = document.getElementById('chart');
  // draw in real pixel coordinates so text is never stretched
  const box = svg.getBoundingClientRect();
  const W = Math.max(360, Math.round(box.width || 800));
  const H = Math.max(200, Math.round(box.height || 260));
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio', 'none');
  const P = 34;
  const lastPoll = polls.get(last)||[];
  // rows are written in rank order
  const topNames = lastPoll.filter(r => (+r[5]) > 0)
                           .slice(0,5).map(r=>r[f.oN]).filter(Boolean);
  let lo=1e9, hi=-1e9;
  const series = topNames.map(n=>{
    const pts = times.map((t,i)=>{
      const r = (polls.get(t)||[]).find(x=>x[f.oN]===n);
      const v = r? +r[f.oSc] : null;
      if(v!=null){ lo=Math.min(lo,v); hi=Math.max(hi,v); }
      return {i,v};
    });
    return {name:n, pts};
  });
  if(!series.length){ svg.innerHTML=''; return; }

  // ---- nice axis ticks -------------------------------------------------
  const span = Math.max(hi - lo, 1);
  const rawStep = span / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const norm = rawStep / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  const yLo = Math.max(0, Math.floor(lo / step) * step);
  const yHi = Math.ceil(hi / step) * step;
  // time-proportional x axis (handles gaps from restarts)
  const tsMs = times.map(t => new Date(String(t).replace(' ', 'T')).getTime() || 0);
  const t0 = tsMs[0], t1 = tsMs[tsMs.length-1] || (t0 + 1);
  const x = i => P + (W-2*P) * ((tsMs[i]-t0) / ((t1-t0)||1));
  const y = v => H-P - (H-2*P) * ((v-yLo)/((yHi-yLo)||1));
  const colors=['#58a6ff','#3fb950','#d29922','#f778ba','#a371f7','#39c5cf'];
  let out='';
  // horizontal grid + y ticks (multiples of step)
  for(let v=yLo; v<=yHi+1e-9; v+=step){
    const yy = y(v);
    out += `<line x1="${P}" y1="${yy.toFixed(1)}" x2="${W-P}" y2="${yy.toFixed(1)}"
             stroke="#262b36" stroke-width="1"/>`;
    out += `<text x="${P-6}" y="${(yy+3).toFixed(1)}" fill="#8b93a7" font-size="10"
             text-anchor="end">${v.toFixed(0)}</text>`;
  }
  series.forEach((s,k)=>{
    const d = s.pts.filter(p=>p.v!=null).map((p,j)=>
      (j?'L':'M')+x(p.i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
    out += `<path d="${d}" fill="none" stroke="${colors[k%6]}" stroke-width="2.5"/>`;
  });
  out += `<line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="#262b36"/>`;
  // x ticks: 5 evenly spaced in TIME, snapped to the nearest sample
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(p => {
    const target = t0 + (t1-t0)*p;
    let best = 0, bd = Infinity;
    tsMs.forEach((m,i)=>{ const d=Math.abs(m-target); if(d<bd){bd=d;best=i;} });
    return best;
  });
  [...new Set(ticks)].forEach((idx,k,arr)=>{
    if(idx<0) return;
    const t=times[idx]||'';
    out += `<text x="${x(idx).toFixed(1)}" y="${H-P+14}" fill="#8b93a7" font-size="10"
             text-anchor="${k===0?'start':(k===arr.length-1?'end':'middle')}">${t.slice(11,16)}</text>`;
  });
  svg.innerHTML = out;

  // legend instead of cramped inline labels
  document.getElementById('legend').innerHTML = series.map((s,k)=>{
    const last = s.pts.filter(p=>p.v!=null).pop();
    return `<span><i style="background:${colors[k%6]}"></i>${s.name}
            <span class="muted">${last?last.v.toFixed(2):'-'}</span></span>`;
  }).join('');
}

refresh();
setInterval(refresh, 15000);
</script>
